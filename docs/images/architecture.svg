<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a1a2e"/><stop offset="1" stop-color="#16213e"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e63946"/><stop offset="1" stop-color="#ff6b6b"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity=".3"/></filter>
  </defs>
  <rect width="900" height="520" rx="16" fill="#0f0f23"/>
  <text x="450" y="36" text-anchor="middle" fill="#e63946" font-size="20" font-weight="700" letter-spacing="3">MOSKILL SYSTEM ARCHITECTURE</text>

  <!-- HV Section -->
  <rect x="20" y="60" width="200" height="200" rx="12" fill="url(#g1)" stroke="#e63946" stroke-width="1.5" filter="url(#sh)"/>
  <text x="120" y="86" text-anchor="middle" fill="#e63946" font-size="13" font-weight="600">HV BOOST CIRCUIT</text>
  <text x="120" y="110" text-anchor="middle" fill="#888" font-size="11">NE555 Oscillator</text>
  <text x="120" y="128" text-anchor="middle" fill="#888" font-size="11">AO3400 MOSFET</text>
  <text x="120" y="146" text-anchor="middle" fill="#888" font-size="11">EE13 Transformer 10:200</text>
  <text x="120" y="170" text-anchor="middle" fill="#f39c12" font-size="11">3-Stage Cockcroft-Walton</text>
  <text x="120" y="194" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">~2000V DC</text>
  <rect x="50" y="210" width="140" height="36" rx="8" fill="rgba(230,57,70,.15)" stroke="#e63946" stroke-width="1"/>
  <text x="120" y="233" text-anchor="middle" fill="#e63946" font-size="12" font-weight="600">Kill Grid</text>

  <!-- MCU Section -->
  <rect x="250" y="60" width="240" height="200" rx="12" fill="url(#g1)" stroke="#3498db" stroke-width="1.5" filter="url(#sh)"/>
  <text x="370" y="86" text-anchor="middle" fill="#3498db" font-size="13" font-weight="600">ESP32-C3-MINI-1</text>
  <text x="370" y="110" text-anchor="middle" fill="#ccc" font-size="11">RISC-V 160MHz | 4MB Flash | BLE 5.0</text>
  <g fill="#888" font-size="11">
    <rect x="264" y="122" width="108" height="28" rx="6" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.1)" stroke-width=".5"/>
    <text x="318" y="140" text-anchor="middle" fill="#e0e0e0">Kill Detector</text>
    <rect x="378" y="122" width="100" height="28" rx="6" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.1)" stroke-width=".5"/>
    <text x="428" y="140" text-anchor="middle" fill="#e0e0e0">Stats Engine</text>
    <rect x="264" y="156" width="108" height="28" rx="6" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.1)" stroke-width=".5"/>
    <text x="318" y="174" text-anchor="middle" fill="#e0e0e0">BLE Service</text>
    <rect x="378" y="156" width="100" height="28" rx="6" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.1)" stroke-width=".5"/>
    <text x="428" y="174" text-anchor="middle" fill="#e0e0e0">Power Mgmt</text>
    <rect x="264" y="190" width="108" height="28" rx="6" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.1)" stroke-width=".5"/>
    <text x="318" y="208" text-anchor="middle" fill="#e0e0e0">Env Sensor</text>
    <rect x="378" y="190" width="100" height="28" rx="6" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.1)" stroke-width=".5"/>
    <text x="428" y="208" text-anchor="middle" fill="#e0e0e0">OTA Handler</text>
  </g>

  <!-- Sense Chain Arrow -->
  <line x1="220" y1="160" x2="250" y2="160" stroke="#e63946" stroke-width="2" marker-end="url(#arr)"/>
  <defs><marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6" fill="#e63946"/></marker></defs>
  <text x="235" y="152" text-anchor="middle" fill="#e63946" font-size="9">ADC</text>

  <!-- BLE Arrow -->
  <line x1="490" y1="160" x2="540" y2="160" stroke="#3498db" stroke-width="2" stroke-dasharray="6 3"/>

  <!-- App Section -->
  <rect x="550" y="60" width="330" height="200" rx="12" fill="url(#g1)" stroke="#2ecc71" stroke-width="1.5" filter="url(#sh)"/>
  <text x="715" y="86" text-anchor="middle" fill="#2ecc71" font-size="13" font-weight="600">UNIAPP CROSS-PLATFORM</text>
  <text x="715" y="108" text-anchor="middle" fill="#ccc" font-size="11">Vue 3 | WeChat | Android | iOS | H5</text>
  <g font-size="10">
    <rect x="564" y="120" width="96" height="50" rx="8" fill="rgba(230,57,70,.1)" stroke="rgba(230,57,70,.3)" stroke-width=".8"/>
    <text x="612" y="140" text-anchor="middle" fill="#e63946" font-weight="600">Dashboard</text>
    <text x="612" y="154" text-anchor="middle" fill="#888">Kill Counter</text>
    <rect x="666" y="120" width="96" height="50" rx="8" fill="rgba(52,152,219,.1)" stroke="rgba(52,152,219,.3)" stroke-width=".8"/>
    <text x="714" y="140" text-anchor="middle" fill="#3498db" font-weight="600">Statistics</text>
    <text x="714" y="154" text-anchor="middle" fill="#888">Charts + Pie</text>
    <rect x="768" y="120" width="96" height="50" rx="8" fill="rgba(243,156,18,.1)" stroke="rgba(243,156,18,.3)" stroke-width=".8"/>
    <text x="816" y="140" text-anchor="middle" fill="#f39c12" font-weight="600">Leaderboard</text>
    <text x="816" y="154" text-anchor="middle" fill="#888">Podium + Rank</text>
    <rect x="564" y="178" width="96" height="50" rx="8" fill="rgba(46,204,113,.1)" stroke="rgba(46,204,113,.3)" stroke-width=".8"/>
    <text x="612" y="198" text-anchor="middle" fill="#2ecc71" font-weight="600">Control</text>
    <text x="612" y="212" text-anchor="middle" fill="#888">Config + LED</text>
    <rect x="666" y="178" width="96" height="50" rx="8" fill="rgba(155,89,182,.1)" stroke="rgba(155,89,182,.3)" stroke-width=".8"/>
    <text x="714" y="198" text-anchor="middle" fill="#9b59b6" font-weight="600">OTA Update</text>
    <text x="714" y="212" text-anchor="middle" fill="#888">BLE Firmware</text>
    <rect x="768" y="178" width="96" height="50" rx="8" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.1)" stroke-width=".8"/>
    <text x="816" y="198" text-anchor="middle" fill="#e0e0e0" font-weight="600">Dev Mode</text>
    <text x="816" y="212" text-anchor="middle" fill="#888">Mock Data</text>
  </g>
  <text x="540" y="155" fill="#3498db" font-size="11" font-weight="600">BLE 5.0</text>

  <!-- Peripherals Row -->
  <rect x="20" y="290" width="860" height="90" rx="12" fill="url(#g1)" stroke="rgba(255,255,255,.1)" stroke-width="1" filter="url(#sh)"/>
  <text x="450" y="314" text-anchor="middle" fill="#888" font-size="12" font-weight="600" letter-spacing="2">PERIPHERALS</text>
  <g font-size="11" text-anchor="middle">
    <rect x="40" y="325" width="120" height="40" rx="8" fill="rgba(230,57,70,.1)"/><text x="100" y="340" fill="#e63946" font-weight="600">AHT20</text><text x="100" y="356" fill="#888">Temp / Humi</text>
    <rect x="175" y="325" width="120" height="40" rx="8" fill="rgba(46,204,113,.1)"/><text x="235" y="340" fill="#2ecc71" font-weight="600">WS2812B</text><text x="235" y="356" fill="#888">RGB LED</text>
    <rect x="310" y="325" width="120" height="40" rx="8" fill="rgba(243,156,18,.1)"/><text x="370" y="340" fill="#f39c12" font-weight="600">Piezo Buzzer</text><text x="370" y="356" fill="#888">Kill Sound</text>
    <rect x="445" y="325" width="120" height="40" rx="8" fill="rgba(52,152,219,.1)"/><text x="505" y="340" fill="#3498db" font-weight="600">0.1ohm Sense</text><text x="505" y="356" fill="#888">Current Pulse</text>
    <rect x="580" y="325" width="120" height="40" rx="8" fill="rgba(155,89,182,.1)"/><text x="640" y="340" fill="#9b59b6" font-weight="600">TP4056</text><text x="640" y="356" fill="#888">USB-C Charge</text>
    <rect x="715" y="325" width="145" height="40" rx="8" fill="rgba(231,76,60,.1)"/><text x="787" y="340" fill="#e74c3c" font-weight="600">DW01A + FS8205A</text><text x="787" y="356" fill="#888">Battery Protect</text>
  </g>

  <!-- PCB Info Bar -->
  <rect x="20" y="400" width="860" height="100" rx="12" fill="url(#g1)" stroke="rgba(255,255,255,.08)" stroke-width="1" filter="url(#sh)"/>
  <text x="450" y="424" text-anchor="middle" fill="#888" font-size="12" font-weight="600" letter-spacing="2">PCB SPECIFICATIONS</text>
  <g font-size="12" text-anchor="middle">
    <text x="100" y="454" fill="#fff" font-weight="700">30 x 100 mm</text><text x="100" y="472" fill="#666">Board Size</text>
    <text x="250" y="454" fill="#fff" font-weight="700">2 Layers</text><text x="250" y="472" fill="#666">Copper</text>
    <text x="400" y="454" fill="#fff" font-weight="700">91 Components</text><text x="400" y="472" fill="#666">SMD + TH</text>
    <text x="550" y="454" fill="#fff" font-weight="700">KiCad 9</text><text x="550" y="472" fill="#666">EDA</text>
    <text x="700" y="454" fill="#fff" font-weight="700">~24.48 CNY</text><text x="700" y="472" fill="#666">BOM Cost</text>
    <text x="830" y="454" fill="#2ecc71" font-weight="700">JLCPCB</text><text x="830" y="472" fill="#666">Gerber Ready</text>
  </g>
</svg>
